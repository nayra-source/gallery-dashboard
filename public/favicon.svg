<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Diamond Shield -->
  <rect x="4" y="4" width="40" height="40" rx="14" fill="url(#primary-grad)" filter="url(#shadow)" />
  <rect x="5" y="5" width="38" height="38" rx="13" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Inner Dark Aperture Well -->
  <circle cx="24" cy="24" r="14" fill="#0f172a" fill-opacity="0.85" />
  <circle cx="24" cy="24" r="14" stroke="url(#glow-grad)" stroke-width="1.2" />

  <!-- Optical Aperture Blades / Iris Geometry -->
  <path d="M24 13L29 21H19L24 13Z" fill="url(#primary-grad)" fill-opacity="0.9" />
  <path d="M33 20L31 29L22 25L33 20Z" fill="url(#primary-grad)" fill-opacity="0.8" />
  <path d="M29 33L20 33L21 23L29 33Z" fill="url(#primary-grad)" fill-opacity="0.9" />
  <path d="M15 27L17 18L26 22L15 27Z" fill="url(#primary-grad)" fill-opacity="0.8" />

  <!-- Center Jewel Lens -->
  <circle cx="24" cy="24" r="4.5" fill="#38bdf8" />
  <circle cx="22.5" cy="22.5" r="1.5" fill="white" />
</svg>
